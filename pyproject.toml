[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rekit-tools"
version = "1.0.1"
description = "Auditable Windows helpers for a local rekit runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "LiLin", email = "239091408+LiLinWilliam@users.noreply.github.com" },
]
dependencies = []

[project.scripts]
rekit-tools = "rekit_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".git", "venv", "toolchain", "samples", "logs", "cache", "temp", "tmp", "backups"]

[tool.ruff.lint]
select = ["E4", "E9", "F"]
ignore = ["E401", "E501"]
